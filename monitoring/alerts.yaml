# ==============================================================================
# Surveillance Qualité IA en Production & Règles d'Alertes Grafana (§9.3)
# ==============================================================================
groups:
  - name: notely_ocr_quality_alerts
    interval: 60s
    rules:
      # 1. Alerte Dérive Qualité : Hausse du taux de correction > 20 % sur 7 jours
      - alert: OcrCorrectionRateSpike
        expr: >
          (
            sum(rate(ocr_corrections_total[7d]))
            /
            sum(rate(ocr_line_latency_seconds_count[7d]))
          ) > 1.20 * (
            sum(rate(ocr_corrections_total[7d] offset 7d))
            /
            sum(rate(ocr_line_latency_seconds_count[7d] offset 7d))
          )
        for: 2h
        labels:
          severity: warning
          component: ocr_model
        annotations:
          summary: "Dérive qualité du modèle OCR détectée"
          description: >
            Le taux de correction utilisateur (corrections/100 mots) a augmenté de plus de 20 % 
            au cours des 7 derniers jours. Vérifier la version active du modèle ou déclencher un rollback.

      # 2. Alerte Performance : Latence p95 > 1.5 s par ligne
      - alert: OcrP95LatencyExceeded
        expr: ocr_line_latency_seconds{quantile="0.95"} > 1.5
        for: 5m
        labels:
          severity: warning
          component: ocr_worker
        annotations:
          summary: "Latence d'inférence OCR p95 trop élevée (> 1.5 s)"
          description: >
            La latence au 95ème percentile dépasse l'objectif SLA de 1.5 s par ligne. 
            Vérifier la charge CPU/GPU et le dimensionnement des workers Celery.

      # 3. Alerte Fiabilité : Taux d'échec des jobs OCR > 1 %
      - alert: OcrJobFailureRateHigh
        expr: ocr_job_failure_ratio > 0.01
        for: 10m
        labels:
          severity: critical
          component: ocr_pipeline
        annotations:
          summary: "Taux d'échec des jobs OCR supérieur à 1 %"
          description: >
            Plus de 1 % des tâches OCR asynchrones échouent actuellement. 
            Inspecter immédiatement les logs applicatifs et l'état de Redis / TrOCR.

      # 4. Alerte Cache : Taux de succès cache anormalement bas
      - alert: OcrCacheHitRatioDrop
        expr: ocr_cache_hit_ratio < 0.10 and ocr_line_latency_seconds_count > 100
        for: 30m
        labels:
          severity: info
          component: ocr_cache
        annotations:
          summary: "Taux de succès du cache HTR anormalement faible"
          description: >
            Le cache hit ratio est tombé sous 10 %. Vérifier la connectivité Redis et la stabilité 
            des clés de hachage de tracés.
