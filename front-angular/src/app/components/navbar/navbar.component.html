<header class="notely-navbar">
  <div class="nav-brand" (click)="goDashboard()">
    <div class="logo-wrapper">
      <img src="logo.png" alt="Notely Logo" class="brand-logo" />
      <span class="logo-glow"></span>
    </div>
    <div class="brand-text">
      <span class="brand-name">Notely</span>
      <span class="brand-tagline">Quantum Ink AI</span>
    </div>
  </div>

  <div class="nav-center">
    <button 
      class="nav-tab-btn" 
      [class.active]="(stateService.currentView$ | async) === 'dashboard'"
      (click)="goDashboard()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="7" height="7"></rect>
        <rect x="14" y="3" width="7" height="7"></rect>
        <rect x="14" y="14" width="7" height="7"></rect>
        <rect x="3" y="14" width="7" height="7"></rect>
      </svg>
      Tableau de bord
    </button>

    @if ((stateService.currentLesson$ | async); as currentLesson) {
      <div class="active-course-chip" (click)="stateService.setView('editor')">
        <span class="dot"></span>
        <span class="course-name">{{ currentLesson.title }}</span>
        @if ((stateService.lastSavedTime$ | async); as savedTime) {
          <span class="save-time">💾 {{ savedTime }}</span>
        }
      </div>
    }
  </div>

  <div class="nav-actions">
    <div class="ai-status-badge">
      <span class="status-pulse"></span>
      <span class="status-text">OCR & IA Actif</span>
    </div>

    <button class="logout-btn" (click)="logout()" title="Déconnexion">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
    </button>
  </div>
</header>
