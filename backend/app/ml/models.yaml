engines:
  trocr_fr:
    type: trocr
    source: microsoft/trocr-base-handwritten
    version: v3-fr
    languages: [fr]
  trocr_en:
    type: trocr
    source: microsoft/trocr-base-handwritten
    version: v3-en
    languages: [en]
  trocr_de:
    type: trocr
    source: microsoft/trocr-base-handwritten
    version: v3-de
    languages: [de]

routing:
  fr:
    chain: [trocr_fr]
    min_confidence: 0.55
  en:
    chain: [trocr_en]
    min_confidence: 0.55
  de:
    chain: [trocr_de]
    min_confidence: 0.55
  ar:
    chain: [trocr_fr]
    min_confidence: 0.0
  auto:
    chain: [trocr_fr, trocr_en]
    min_confidence: 0.55

thresholds:
  sure: 0.80
  wrong: 0.50
