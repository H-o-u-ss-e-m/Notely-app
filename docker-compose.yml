services:
  ocr-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ocr_manuscrit_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=true
      - DEVICE=cpu
      - TROCR_MODEL=microsoft/trocr-base-handwritten
    volumes:
      - ./backend:/app/backend
