[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "notely-backend"
version = "2.0.0"
description = "Notely Smart Handwriting Notebook API"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q -p no:warnings"
