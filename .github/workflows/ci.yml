name: Notely CI/CD Pipeline

on:
  push:
    branches: [main, develop, "feat/**", "fix/**"]
  pull_request:
    branches: [main, develop]

jobs:
  backend-and-mlops:
    name: Backend, Sécurité & Non-Régression IA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r backend/requirements.txt
          pip install pytest-asyncio

      - name: Run Backend unit & integration tests
        env:
          DATABASE_URL: sqlite:///:memory:
          JWT_SECRET_KEY: test_secret_key_minimum_32_characters_long_for_ci
          ENV: test
          SKIP_MODEL_LOAD: "1"
          PYTHONPATH: backend
        run: |
          python -m pytest backend/tests/unit -v --ignore=backend/tests/unit/test_correction_layer_v2.py

  frontend-angular:
    name: Angular Build & Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Angular dependencies
        run: |
          cd front-angular
          npm install --no-audit --no-fund

      - name: Build Angular production bundle
        run: |
          cd front-angular
          npm run build

  mobile-flutter:
    name: Mobile Flutter Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: "stable"

      - name: Flutter pub get & analyze
        run: |
          cd mobile
          flutter pub get
          flutter analyze --no-fatal-infos || true
